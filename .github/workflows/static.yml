name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish only the site. Uploading '.' also served CLAUDE.md, DESIGN.md,
      # REWRITE-PLAN.md and .claude/ at exitblueprint.net. A new public file
      # must be added here; anything not listed is not deployed.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html favicon.svg apple-touch-icon.png _site/
          cp -R brand _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
